# 1. Xóa file pnpm-lock.yaml bị hỏng hiện tại
rm pnpm-lock.yaml

# 2. Chạy pnpm install để pnpm tự động sinh ra file pnpm-lock.yaml chuẩn YAML
pnpm install

# 3. Commit file pnpm-lock.yaml mới tạo
git add pnpm-lock.yaml
git commit -m "fix: generate valid pnpm-lock.yaml"

# 4. Push lên GitHub
git push origin main
